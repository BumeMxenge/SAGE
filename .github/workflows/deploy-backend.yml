# Ships the backend after CI passes on main: build the image, push it to ghcr.io, run it on Azure, check /health
name: Deploy backend

on:
  workflow_run: # starts when the CI workflow finishes on main
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button, to redeploy main without a new commit

permissions:
  contents: read # read the code
  packages: write # push the image to ghcr.io
  id-token: write # get the signed token that Azure swaps for a sign-in

concurrency: # one deploy at a time; a deploy that has started is never cut off halfway
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # stops at the first failed command, including one inside a pipe

env:
  IMAGE: ghcr.io/bumemxenge/sage-backend # ghcr.io only accepts lowercase names
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }} # the commit CI tested (or main's tip on a manual run)
  RESOURCE_GROUP: rg-sage
  CONTAINER_ENV: cae-sage # the Container Apps environment from infra/azure/setup.sh
  APP: ca-sage-api
  # Size and scaling: edit, push, and the next deploy applies them
  CPU: "0.25" # vCPU per replica
  MEMORY: 0.5Gi # must be 2 x CPU in GiB
  MIN_REPLICAS: "0" # 0 = free while idle, but the first request after a quiet spell waits for a cold start
  MAX_REPLICAS: "1"

jobs:
  deploy:
    name: Build, push and deploy
    # Only a CI run that passed on a push to main in this repo (a fork can also have a branch called main),
    # or a manual run on main. Azure trusts runs on main only, so anything else would fail at sign-in anyway.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04 # pinned, like CI: ubuntu-latest moves to Ubuntu 26 on 19 October
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }} # exactly the commit CI passed, even if main has moved on since
          persist-credentials: false # this job never pushes to git

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          labels: | # links the package to this repo on GitHub, and records the commit inside the image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          provenance: false # one plain image, without the extra attestation entry that shows as "unknown/unknown"
          cache-from: type=gha
          cache-to: type=gha,mode=max # reuses unchanged layers (e.g. dependencies) between runs

      - name: Check the image is public
        # Azure pulls without a password, so the package must be public. New ghcr.io packages start private.
        run: |
          repo=${IMAGE#ghcr.io/}
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" |
            jq -r '.token // empty' || true) # a token with no password, as Azure would get
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/$repo/manifests/$SHA")
          if [[ $status != 200 ]]; then
            settings="${{ github.server_url }}/users/${{ github.repository_owner }}/packages/container/sage-backend/settings"
            echo "::error::Azure can't pull the image without a password (HTTP $status). Make it public once: $settings"
            exit 1
          fi
          echo "$IMAGE:$SHA is public"

      - name: Sign in to Azure
        # No password: Azure checks GitHub's signed token against the identity from setup.sh
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create or update the container app
        run: |
          size=(--cpu "$CPU" --memory "$MEMORY" --min-replicas "$MIN_REPLICAS" --max-replicas "$MAX_REPLICAS")
          if az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP" --output none 2>/dev/null; then
            az containerapp update --resource-group "$RESOURCE_GROUP" --name "$APP" \
              --image "$IMAGE:$SHA" "${size[@]}" --output none
          else
            # First deploy only. setup.sh couldn't create the app, because an app needs an image.
            az containerapp create --resource-group "$RESOURCE_GROUP" --name "$APP" \
              --environment "$CONTAINER_ENV" --image "$IMAGE:$SHA" \
              --ingress external --target-port 8000 "${size[@]}" --output none
          fi

      - name: Wait for the new revision to take over
        # If a new version fails to start, Azure quietly keeps the old one serving, so /health alone could pass
        run: |
          show() { az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP" --query "$1" --output tsv; }
          latest=$(show properties.latestRevisionName)
          for _ in {1..30}; do # up to 5 minutes
            if [[ $(show properties.latestReadyRevisionName) == "$latest" ]]; then
              echo "Revision $latest is serving"
              exit 0
            fi
            state=$(az containerapp revision show --resource-group "$RESOURCE_GROUP" --name "$APP" \
              --revision "$latest" --query properties.provisioningState --output tsv || true)
            [[ $state == Failed ]] && break
            sleep 10
          done
          echo "::error::Revision $latest didn't start. See why: az containerapp logs show -g $RESOURCE_GROUP -n $APP --type system"
          exit 1

      - name: Check /health on the live URL
        run: |
          url="https://$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP" \
            --query properties.configuration.ingress.fqdn --output tsv)"
          # The retries ride out a cold start if the app has scaled to zero
          curl --fail --silent --show-error --max-time 30 \
            --retry 12 --retry-delay 10 --retry-all-errors "$url/health"
          echo
          echo "Backend live at $url (commit $SHA)" >> "$GITHUB_STEP_SUMMARY"
