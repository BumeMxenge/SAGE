# Checks every push to main and every pull request: one job per part of the stack
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read # the run can read the code and change nothing

concurrency: # a newer push cancels the older run on the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUFF_OUTPUT_FORMAT: github # lint errors appear on the exact line in GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23" # same uv as the Dockerfile and laptop
      - name: Install from uv.lock
        working-directory: backend
        run: uv sync --locked # fails if uv.lock is out of date, rather than quietly updating it
      - name: Lint, check formatting and run unit tests
        run: make check-backend # the Makefile holds the commands, so the laptop and CI run the same ones

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from package-lock.json
        working-directory: frontend
        run: npm ci
      - name: Lint, test and build
        run: make check-frontend

  database:
    name: Database (SQL migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0 # same CLI as the Makefile's npx supabase@2.120.0
      - name: Apply migrations to an empty database, then lint and check them
        # The security check fails if a table the API can reach has no row level security
        run: make check-db SUPABASE=supabase
