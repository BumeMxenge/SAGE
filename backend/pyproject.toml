# Backend package definition: dependencies (managed by uv), CLI entry point, build and test settings
[project]
name = "sage-backend"
version = "0.1.0"
description = "SAGE backend: ingestion, constraint engine and advisor behind a FastAPI API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "supabase>=2.0",
    "httpx>=0.27",
]

[project.scripts]
sage = "sage.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = ["integration: needs live Supabase or a model API"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"] # import order, likely bugs, outdated syntax
