# Backend package definition: dependencies (managed by uv), CLI entry point, build and test settings
[project]
name = "sage-backend"
version = "0.1.0"
description = "SAGE backend: ingestion, constraint engine and advisor behind a FastAPI API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "supabase>=2.0",
    "postgrest>=2.0", # imported directly, not only through supabase
    "pyjwt>=2.0", # imported directly, not only through supabase
    "pdfplumber>=0.11.10",
    "pdfminer.six>=20260107", # imported directly, not only through pdfplumber
]

[project.scripts]
sage = "sage.cli:main"

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx>=0.28", # the token tests serve Supabase's replies through it
    "httpx2>=2.13.1", # FastAPI's TestClient uses it to call the app in tests
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = ["integration: needs local Supabase (make test-integration)"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"] # import order, likely bugs, outdated syntax
