# Backend package definition: dependencies (managed by uv), CLI entry point, build and test settings
[project]
name = "sage-backend"
version = "0.1.0"
description = "SAGE backend: ingestion, constraint engine and advisor behind a FastAPI API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0", # imported directly, not only through fastapi
    "starlette>=1.0", # imported directly, not only through fastapi
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "supabase>=2.0",
    "postgrest>=2.0", # imported directly, not only through supabase
    "pyjwt>=2.0", # imported directly, not only through supabase
    "supabase-auth>=2.0", # imported directly, not only through supabase
    "pdfplumber>=0.11.10",
    "openpyxl>=3.1.5",
    "clingo>=5.8.2", # the plan generator's answer set solver
    "openai>=3.29.0", # the advisor's model, GPT-6 Luna
]

[project.scripts]
sage = "sage.cli:main"

[dependency-groups]
dev = [
    # Never called: make test collects ATP-1's test_scoring.py, which imports scoring, then E2's
    # score.py, then its drafting.py, which imports it
    "anthropic>=1.15.0",
    "fpdf2>=2.8.9",
    "httpx>=0.28", # the token tests serve Supabase's replies through it
    "httpx2>=2.13.1", # FastAPI's TestClient calls the app through it, and two tests import it
    "import-linter>=2.15", # make lint's check of the dependency rule, lint-imports
    "pytest>=8.0",
    "pytest-cov>=7.1", # make test's coverage report
    "ruff>=0.6",
]
# make mutation's tools. Not in dev, so CI and the image never install them.
mutation = [
    "mutmut==3.7.0", # pinned, as another version plants different mutants and scores wouldn't compare
    "libcst<1.9", # mutmut 3.8 needs libcst 1.9, which has no Intel Mac wheel for Python 3.12
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "integration: needs local Supabase (make test-integration)",
]

# make test's coverage report: each file's lines that no unit test runs
[tool.coverage.run]
source = ["sage"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# make mutation: the code mutmut plants faults in, and the tests that must catch them
[tool.mutmut]
source_paths = ["src"]
only_mutate = [
    "src/sage/advisor/*",
    "src/sage/engine/*",
    "src/sage/features/*",
    "src/sage/ingestion/*",
    "src/sage/shared/*",
]
# The outside services' adapters and the fakes stay out, as only the integration tests check them
do_not_mutate = [
    "src/sage/shared/openai.py",
    "src/sage/shared/supabase/*",
    "src/sage/shared/memory/*",
]
pytest_add_cli_args_test_selection = ["-m", "not integration"]

# The dependency rule in docs/architecture.md, as contracts that make lint checks with lint-imports
[tool.importlinter]
root_package = "sage"
include_external_packages = true # so the last two contracts can name outside packages

[[tool.importlinter.contracts]]
name = "Imports point inward"
type = "layers"
layers = [
    "sage.main | sage.cli",
    "sage.features",
    "sage.advisor",
    "sage.engine | sage.ingestion",
    "sage.shared",
    "sage.config",
]

[[tool.importlinter.contracts]]
name = "Features don't import each other, except where one is built on another"
type = "independence"
modules = ["sage.features.*"]
ignore_imports = [
    "sage.features.chats.* -> sage.features.plans.*",
    "sage.features.questionnaire.* -> sage.features.plans.*",
    "sage.features.onboarding.* -> sage.features.accounts.*",
]

[[tool.importlinter.contracts]]
name = "Only main.py plugs in the engine and the advisor"
type = "protected"
protected_modules = ["sage.engine", "sage.advisor"]
allowed_importers = ["sage.main"]

[[tool.importlinter.contracts]]
name = "Only shared/supabase/ imports Supabase's SDK"
type = "protected"
protected_modules = ["supabase", "supabase_auth", "postgrest", "jwt"]
allowed_importers = ["sage.shared.supabase"]

[[tool.importlinter.contracts]]
name = "No module under sage imports Anthropic's SDK"
type = "forbidden"
source_modules = ["sage"]
forbidden_modules = ["anthropic"]

[[tool.importlinter.contracts]]
name = "Only shared/openai.py imports OpenAI's SDK"
type = "protected"
protected_modules = ["openai"]
allowed_importers = ["sage.shared.openai"]

[[tool.importlinter.contracts]]
name = "Only engine/solver.py imports clingo"
type = "protected"
protected_modules = ["clingo"]
allowed_importers = ["sage.engine.solver"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"] # import order, likely bugs, outdated syntax
