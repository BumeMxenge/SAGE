# The 2026 handbook year's sources: every file ingestion reads, with its SHA-256. A file whose
# fingerprint no longer matches stops the run, so a changed source never goes unnoticed. Pages are
# the printed page numbers.

year = 2026
# The department whose curricula are in scope, by its printed heading
department = "Electrical Engineering"

[handbook]
file = "EBE_2026.pdf"
format = "pdf"
# As the complementary workbook names it, so both readers give the book one name
title = "UCT Faculty of Engineering & the Built Environment Undergraduate Handbook 2026 (Book 7a)"
# UCT's published copy, byte for byte, so anyone can check the fingerprint
url = "https://onlinecourses.uct.ac.za/sites/default/files/media/documents/2026-ebe-handbook-7a-final-web.pdf"
sha256 = "796ffd0b5754995b8c875e2cc8912fdda818077fb8c035f2f8d1fb42a26e2e9f"

# The prose cut into passages, besides every course entry and curriculum table in scope: each
# section by its printed heading and pages. The department's staff list isn't among them.
[[handbook.passages]]
section = "Term Dates for 2026"
pages = [10, 10]

[[handbook.passages]]
section = "Lecture periods"
pages = [10, 10]

[[handbook.passages]]
section = "Lecture timetable"
pages = [10, 10]

[[handbook.passages]]
section = "Course Codes"
pages = [10, 11]

[[handbook.passages]]
section = "Course Codes – Explanatory Notes"
pages = [11, 12]

[[handbook.passages]]
section = "Courses: Guide To Terminology"
pages = [12, 12]

[[handbook.passages]]
section = "Credit System"
pages = [12, 12]

# One passage per rule clause, such as FB8.10
[[handbook.passages]]
section = "Rules for Undergraduate Degrees"
pages = [13, 21]

# The department's programmes: each curriculum's introduction and tables, then the access route
# for transferees. Each ends partway down its last page, at the heading named by until.
[[handbook.passages]]
section = "Electrical Engineering"
pages = [48, 61]
until = "Access for University of Technology Transferees"

[[handbook.passages]]
section = "Access for University of Technology Transferees"
pages = [61, 61]
until = "Mechanical Engineering"

[[handbook.passages]]
section = "The ASPECT Programme"
pages = [70, 70]

[timetable]
file = "2026_timetable.xlsx"
format = "xlsx"
title = "2026 EEE Timetables"
sha256 = "45de2ef0621f93b6974b06775f73d99d69ea8cec999c1d412c563b589a27181a"
# Courses the Labs sheet prints that no EEE curriculum lists, left out at C1's Stop 1 (reading 4), so
# the timetable check reports their cells rather than failing
excluded = ["EEE2041F", "EEE2042S", "EEE2046S"]

# The sheets read, each with the curricula it shows. Labs holds meetings for everyone on a course,
# so it names none. The MEC and SCI sheets show other departments' programmes and aren't read.
[timetable.sheets]
EB009 = ["EB009EEE01"]
EB011 = ["EB011EEE05"]
EB022 = ["EB022EEE02"]
EB809 = ["EB809EEE01"]
EB811 = ["EB811EEE05"]
EB822 = ["EB822EEE02"]
Labs = []

# Meetings printed side by side of which a student attends one, by their cells in the order of their
# choice letters. EEE3096S's Wednesday lab is an alternative to its Friday one.
[[timetable.alternatives]]
course = "EEE3096S"
group = "lab"
cells = ["Labs!O11:O14", "Labs!M11:M14"]

[complementary]
file = "2026_Complementary_Studies_Course_Details.xlsx"
format = "xlsx"
title = "2026 Complementary Studies Course Details"
sha256 = "b1bc920ad31e271f19dc9e2f5a0137e25147fec039468ea8c7972adebe4e2e0a"
# Each sheet read, by what it holds. Notes is for people, so it isn't read.
courses = "Courses"
languages = "Language options"
meetings = "Meetings"

# Drafted from the 2026 handbook and the 2023 to 2026 replacements. No handbook says "counts as"
# outright, so every row is flagged not_printed for review.
[equivalences]
file = "equivalences.csv"
format = "csv"
title = "Equivalences drafted from the 2023 and 2026 handbooks"
sha256 = "bc0ca21aea5646543bb9082263af74d12869a659200ac37807dee4d6f942a71d"
