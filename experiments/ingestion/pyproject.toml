# The ingestion experiments' environment: the backend's sage package by path, plus what only the
# experiments need, so the backend never installs it. It's an environment, not a package.
[project]
name = "sage-ingestion-experiments"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sage-backend",
    "pdfplumber>=0.11.10", # imported directly, not only through sage-backend
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.sources]
sage-backend = { path = "../../backend", editable = true }

[tool.ruff]
src = ["requirement-parsing"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"] # import order, likely bugs, outdated syntax, as in the backend
