# The advisor experiments' environment: the backend's sage package by path, plus what only the
# experiments need, so the backend never installs it. It's an environment, not a package.
[project]
name = "sage-advisor-experiments"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sage-backend",
    "anthropic>=1.15.0", # imported directly, not only through sage-backend
    "openai>=3.35.1",
    "textstat>=0.7.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
sage-backend = { path = "../../backend", editable = true }

[tool.ruff]
src = ["model-choice"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"] # import order, likely bugs, outdated syntax, as in the backend

[tool.pytest.ini_options]
testpaths = ["model-choice/tests"]
pythonpath = ["model-choice"]
addopts = ["--import-mode=importlib", "--strict-markers"]
