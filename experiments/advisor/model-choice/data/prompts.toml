# E4's prompts: every candidate, the four I choose in each stressor with their labels, and the
# verdicts check_eligibility gives for courses outside Mbali's plans. An AI assistant (Claude)
# drafted the candidates from the data and suggested the picks. I chose, rewrote and labelled them
# from print. Claude then reviewed the labels against the slice, and I accepted its corrections to
# three rewordings, one dropped course code, two tool arguments and some keys and traps.
#
# How to fill it in:
# 1. Set chosen = true on four candidates in each of the eight stressors, 32 in all. Plan
#    actions need one of each kind: a swap to a shown plan, a swap to a hidden plan, no plan
#    because of the at-least-two rule, and no plan because of a fourth elective.
# 2. Rewrite each chosen question in a student's voice, keeping its trap.
# 3. Label each chosen prompt from print, in the fields under its why note:
#    outcome    answer or refer
#    passages   the sections that support it, named as the why note names them
#    key        Part A: words or numbers a right answer states, such as ["116"]
#    trap       Part A: words or numbers that mark the tempting wrong answer, such as ["112"]
#    tool       Part B: get_course, find_plan or check_eligibility, or "" for a question the
#               plan context answers
#    arguments  Part B: the least a right call asks for, such as {code = "EEE4121F"} or
#               {have = ["EEE4118F"], avoid = ["EEE4120F"]}
#    verdict    where the tool is check_eligibility: eligible, check or not_eligible
#    plan       plan actions only: the plan to offer, such as "V01", or "none"
#    notes      anything to keep with the label
#    Each question is asked with sem1 on screen. Add term = "sem2" to a prompt to change it.
# 4. Write each verdict at the bottom from print and her record, or delete one that no chosen
#    prompt uses. A check or not_eligible verdict needs its reason, worded for the student.
# 5. From experiments/advisor/, run: uv run python model-choice/check_labels.py
#
# The labels follow the referral rule in prompt.md. A check verdict, and the practical-training
# reason, are referrals. A firm not_eligible is an answer. No plan because of the at-least-two
# rule is an answer, and a fourth elective is a referral.
#
# Part A asks only what the passages hold, never what the plan context or get_course gives
# (a course's name, credits, NQF level, term, convener, entry requirement or meetings), as a
# Part A answer with no kept quote becomes a referral.
#
# Her plans: V01 Power & Robotics, V02 Signals & Power (hidden), V03 Embedded & Power (hidden),
# V04 Imaging & Control (hidden), V05 Signals & Robotics, V06 Embedded & Robotics, V07 Imaging &
# Power, V08 Signals & Control, V09 Embedded & Control and V10 Imaging & Robotics. Every plan has
# the five core courses, EEE4113F, CML4607F, EEE4124C, EEE4125C and EEE4022S, and its name's two
# electives from the plan names: Power EEE4117F, Control EEE4118F, Robotics EEE4119F, Signals
# EEE4114F, Embedded EEE4120F and Imaging HUB4049F. Her questionnaire hid the three without
# EEE4119F.


